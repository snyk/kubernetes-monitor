commands:
  install_helm:
    description: Install Helm
    steps:
      - run:
          command: |
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            chmod 700 get_helm.sh
            ./get_helm.sh
          name: Install Helm

  setup_npm_auth:
    description: Configure ~/.npmrc with NPM_TOKEN so npm ci can resolve private @snyk/* packages.
    steps:
      - run:
          name: Configure npm auth
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

  save_image_for_gar:
    description: Save the freshly built image to the workspace for the publish orb, on staging only.
    parameters:
      image_to_save:
        type: string
      archive_prefix:
        type: string
    steps:
      - when:
          condition:
            equal: [staging, << pipeline.git.branch >>]
          steps:
            - run:
                name: Tag image for the publish orb
                command: docker tag <<parameters.image_to_save>> kubernetes-monitor:${CIRCLE_WORKFLOW_ID}
            - publish-orb/save-image:
                image_name: kubernetes-monitor
                save_filename_prefix: <<parameters.archive_prefix>>

  stage_image_for_gar:
    description: Stage a saved image archive under the name the publish orb loads, and export LATEST_TAG. Halts the job when staging produced no release.
    parameters:
      archive_prefix:
        type: string
    steps:
      - checkout
      - run:
          name: Export release tag
          command: |
            LATEST_TAG_WITH_V=`git tag --points-at ${CIRCLE_SHA1} | grep '^v' | head -n 1 || true`
            if [ -z "${LATEST_TAG_WITH_V}" ]; then
              echo "No release was cut for ${CIRCLE_SHA1}, nothing to publish to GAR"
              circleci-agent step halt
              exit 0
            fi
            echo "export LATEST_TAG=${LATEST_TAG_WITH_V:1}" >> $BASH_ENV
      - attach_workspace:
          at: /tmp/source-workspace
      - run:
          name: Stage image archive
          command: |
            mkdir -p /tmp/gar-workspace/images
            cp "/tmp/source-workspace/images/<<parameters.archive_prefix>>:$CIRCLE_WORKFLOW_ID.tar.gz" \
              "/tmp/gar-workspace/images/kubernetes-monitor:$CIRCLE_WORKFLOW_ID.tar.gz"

jobs:
  security-scans:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          open-source-additional-arguments: --exclude=test
  # The alpine and ubi9 images share no build stages, so they build, scan and push
  # as two independent jobs. Both run on a machine executor rather than a docker
  # executor plus setup_remote_docker: that avoids shipping the build context to a
  # separate VM, lets docker_layer_caching reuse the gcloud SDK, skopeo, Node and
  # credential-helper layers between runs, and lets resource_class apply to the build
  # itself. `system_tests` already uses this executor.
  build_image_alpine:
    machine:
      docker_layer_caching: true
      image: default
    resource_class: large
    environment:
      DOCKER_BUILDKIT: 1
    steps:
      - checkout
      - run:
          command: |
            IMAGE_TAG=$([[ "$CIRCLE_BRANCH" == "staging" ]] && echo "staging-candidate" || echo "discardable")
            IMAGE_NAME_CANDIDATE=snyk/kubernetes-monitor:${IMAGE_TAG}-${CIRCLE_SHA1}
            echo "export IMAGE_NAME_CANDIDATE=$IMAGE_NAME_CANDIDATE" >> $BASH_ENV
          name: Export environment variables
      - run:
          command: |
            docker login --username ${DOCKERHUB_USER} --password ${DOCKERHUB_PASS}
            ./scripts/docker/build-image.sh ${IMAGE_NAME_CANDIDATE}
          name: Build image
      - prodsec/container_scan:
          mode: gate
          docker-image-name: ${IMAGE_NAME_CANDIDATE}
          docker-file: Dockerfile
          project-name: alpine
      - run:
          command: docker push ${IMAGE_NAME_CANDIDATE}
          name: Push image
      - save_image_for_gar:
          image_to_save: ${IMAGE_NAME_CANDIDATE}
          archive_prefix: kubernetes-monitor-alpine
    working_directory: ~/kubernetes-monitor
  build_image_ubi9:
    machine:
      docker_layer_caching: true
      image: default
    resource_class: large
    environment:
      DOCKER_BUILDKIT: 1
    steps:
      - checkout
      - run:
          command: |
            IMAGE_TAG=$([[ "$CIRCLE_BRANCH" == "staging" ]] && echo "staging-candidate" || echo "discardable")
            IMAGE_NAME_CANDIDATE_UBI9=snyk/kubernetes-monitor:${IMAGE_TAG}-ubi9-${CIRCLE_SHA1:0:8}
            echo "export IMAGE_NAME_CANDIDATE_UBI9=$IMAGE_NAME_CANDIDATE_UBI9" >> $BASH_ENV
          name: Export environment variables
      - run:
          command: |
            docker login --username ${DOCKERHUB_USER} --password ${DOCKERHUB_PASS}
            ./scripts/docker/build-image-ubi9.sh ${IMAGE_NAME_CANDIDATE_UBI9}
          name: Build image
      - prodsec/container_scan:
          mode: gate
          docker-image-name: ${IMAGE_NAME_CANDIDATE_UBI9}
          docker-file: Dockerfile.ubi9
          project-name: ubi9
      - run:
          command: docker push ${IMAGE_NAME_CANDIDATE_UBI9}
          name: Push image
      - save_image_for_gar:
          image_to_save: ${IMAGE_NAME_CANDIDATE_UBI9}
          archive_prefix: kubernetes-monitor-ubi9
    working_directory: ~/kubernetes-monitor
  code_formatter:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - setup_npm_auth
      - run:
          command: npm ci
      - run:
          command: |
            npm run format:check
          name: code formatter check
    working_directory: ~/kubernetes-monitor
  prepare_to_deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          command: ./scripts/circleci-jobs/prepare_to_deploy.sh
          name: Deploy to dev
    working_directory: ~/kubernetes-monitor
  deploy_to_prod:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          command: ./scripts/circleci-jobs/deploy_to_prod.sh
          name: Deploy to prod
    working_directory: ~/kubernetes-monitor
  lint:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - setup_npm_auth
      - run:
          command: npm ci
      - run:
          command: |
            npm run lint
          name: lint
    working_directory: ~/kubernetes-monitor
  publish:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - setup_remote_docker
      - install_helm
      - run:
          command: |
            LATEST_TAG_WITH_V=`git describe --abbrev=0 --tags ${CIRCLE_SHA1}`
            LATEST_TAG=${LATEST_TAG_WITH_V:1}
            IMAGE_NAME_APPROVED=snyk/kubernetes-monitor:${LATEST_TAG}-approved
            IMAGE_NAME_PUBLISHED=snyk/kubernetes-monitor:${LATEST_TAG}
            IMAGE_NAME_APPROVED_UBI9=snyk/kubernetes-monitor:${LATEST_TAG}-ubi9-approved
            IMAGE_NAME_PUBLISHED_UBI9=snyk/kubernetes-monitor:${LATEST_TAG}-ubi9
            echo "export LATEST_TAG=${LATEST_TAG}" >> $BASH_ENV
            echo "export IMAGE_NAME_APPROVED=${IMAGE_NAME_APPROVED}" >> $BASH_ENV
            echo "export IMAGE_NAME_PUBLISHED=${IMAGE_NAME_PUBLISHED}" >> $BASH_ENV
            echo "export IMAGE_NAME_APPROVED_UBI9=${IMAGE_NAME_APPROVED_UBI9}" >> $BASH_ENV
            echo "export IMAGE_NAME_PUBLISHED_UBI9=${IMAGE_NAME_PUBLISHED_UBI9}" >> $BASH_ENV
          name: Export environment variables
      - prodsec/container_scan:
          mode: gate-and-upload
          docker-image-name: ${IMAGE_NAME_APPROVED}
          docker-file: Dockerfile
          project-name: alpine

      - prodsec/container_scan:
          mode: gate-and-upload
          docker-image-name: ${IMAGE_NAME_APPROVED_UBI9}
          docker-file: Dockerfile.ubi9
          project-name: ubi9
      - run:
          command: |
            docker login --username ${DOCKERHUB_USER} --password ${DOCKERHUB_PASS} &&
            docker pull ${IMAGE_NAME_APPROVED} &&
            docker tag ${IMAGE_NAME_APPROVED} ${IMAGE_NAME_PUBLISHED} &&
            docker push ${IMAGE_NAME_PUBLISHED} &&
            docker pull ${IMAGE_NAME_APPROVED_UBI9} &&
            docker tag ${IMAGE_NAME_APPROVED_UBI9} ${IMAGE_NAME_PUBLISHED_UBI9} &&
            docker push ${IMAGE_NAME_PUBLISHED_UBI9} &&
            ./scripts/publish-gh-pages.sh ${LATEST_TAG}
          name: Publish
    working_directory: ~/kubernetes-monitor
  system_tests:
    machine:
      docker_layer_caching: true
      image: default
    steps:
      - checkout
      - setup_npm_auth
      - run:
          command: npm ci
      - run:
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo apt-get install skopeo
          name: Install Skopeo
      - run:
          command: |
            npm run build &&
            npm run test:system
          name: System tests
    working_directory: ~/kubernetes-monitor
  tag_and_push:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - setup_remote_docker
      - setup_npm_auth
      - run:
          command: |
            npm ci &&
            docker login --username ${DOCKERHUB_USER} --password ${DOCKERHUB_PASS} &&
            unset CIRCLE_PULL_REQUEST &&
            unset CI_PULL_REQUEST &&
            unset CI_PULL_REQUESTS &&
            unset CIRCLE_PULL_REQUESTS &&
            npx semantic-release@17.2.2 &&
            NEW_VERSION=`cat ./package.json | jq -r '.version'` &&
            ./scripts/docker/approve-image.sh $NEW_VERSION
          name: Tag and push
    working_directory: ~/kubernetes-monitor
  unit_tests:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - setup_npm_auth
      - run:
          command: npm ci
      - run:
          command: |
            npm run build &&
            npm run test:unit
          name: Unit tests
    working_directory: ~/kubernetes-monitor
main_branches_filter:
  filters:
    branches:
      ignore:
        - staging
        - master
master_branch_only_filter:
  filters:
    branches:
      only:
        - master
orbs:
  aws-cli: circleci/aws-cli@2.0.6
  azure-cli: circleci/azure-cli@1.2.0
  prodsec: snyk/prodsec-orb@1
  publish-orb: snyk/publish@1

staging_branch_only_filter:
  filters:
    branches:
      only:
        - staging
version: 2.1
workflows:
  MERGE_TO_MASTER:
    jobs:
      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime
          filters:
            branches:
              only:
                - master
      - publish:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
            - team-container-integration-docker-hub
            - prodsec-orb-runtime
          requires:
            - Security Scans
          filters:
            branches:
              only:
                - master
      - deploy_to_prod:
          context:
            - kubernetes-monitor
            - snyk-bot-slack
            - engines_sca-scanners
            - team-container-integration-circleci
            - prodsec-orb-runtime
          filters:
            branches:
              only:
                - master
          requires:
            - publish
  MERGE_TO_STAGING:
    jobs:
      - build_image_alpine:
          context:
            - engines_sca-scanners
            - go-private-modules
            - snyk-bot-slack
            - team-container-integration-docker-hub
            - prodsec-orb-runtime
          filters:
            branches:
              only:
                - staging
      - build_image_ubi9:
          context:
            - engines_sca-scanners
            - go-private-modules
            - snyk-bot-slack
            - team-container-integration-docker-hub
            - prodsec-orb-runtime
          filters:
            branches:
              only:
                - staging
      - unit_tests:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
          filters:
            branches:
              only:
                - staging
      - system_tests:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
          filters:
            branches:
              only:
                - staging
      - tag_and_push:
          context:
            - snyk-bot-slack
            - engines_sca-scanners
            - team-container-integration-docker-hub
          filters:
            branches:
              only:
                - staging
          requires:
            - build_image_alpine
            - build_image_ubi9
            - unit_tests
            - system_tests
      - publish-orb/publish:
          name: Publish alpine image to GAR
          context:
            - snyk-docker-build
            - infra-publish-orb
            - engines_sca-scanners
            - prodsec-orb-runtime
          requires:
            - build_image_alpine
            - tag_and_push
          image_mount_path: /tmp/gar-workspace
          image_name: kubernetes-monitor
          image_tags: ${LATEST_TAG}
          publish_helm_chart: false
          snyk_project: alpine
          snyk_target_file: Dockerfile
          pre-steps:
            - stage_image_for_gar:
                archive_prefix: kubernetes-monitor-alpine
          filters:
            branches:
              only:
                - staging
      - publish-orb/publish:
          name: Publish ubi9 image to GAR
          context:
            - snyk-docker-build
            - infra-publish-orb
            - engines_sca-scanners
            - prodsec-orb-runtime
          requires:
            - build_image_ubi9
            - tag_and_push
          image_mount_path: /tmp/gar-workspace
          image_name: kubernetes-monitor
          image_tags: ${LATEST_TAG}-ubi9
          publish_helm_chart: false
          snyk_project: ubi9
          snyk_target_file: Dockerfile.ubi9
          pre-steps:
            - stage_image_for_gar:
                archive_prefix: kubernetes-monitor-ubi9
          filters:
            branches:
              only:
                - staging
      - prepare_to_deploy:
          context:
            - kubernetes-monitor
            - snyk-bot-slack
            - engines_sca-scanners
            - team-container-integration-circleci
          filters:
            branches:
              only:
                - staging
          requires:
            - tag_and_push
            - Publish alpine image to GAR
            - Publish ubi9 image to GAR
  PR_TO_STAGING:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          trusted-branch: main
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-on-snyk_sca-scanners
          filters:
            branches:
              ignore:
                - staging
                - master
      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - snyk-bot-slack
            - prodsec-orb-runtime
          filters:
            branches:
              ignore:
                - staging
                - master
      - build_image_alpine:
          context:
            - engines_sca-scanners
            - go-private-modules
            - snyk-bot-slack
            - team-container-integration-docker-hub
            - prodsec-orb-runtime
          requires:
            - Scan repository for secrets
            - Security Scans
          filters:
            branches:
              ignore:
                - staging
                - master
      - build_image_ubi9:
          context:
            - engines_sca-scanners
            - go-private-modules
            - snyk-bot-slack
            - team-container-integration-docker-hub
            - prodsec-orb-runtime
          requires:
            - Scan repository for secrets
            - Security Scans
          filters:
            branches:
              ignore:
                - staging
                - master
      - unit_tests:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
          filters:
            branches:
              ignore:
                - staging
                - master
      - lint:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
          filters:
            branches:
              ignore:
                - staging
                - master
      - code_formatter:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
          filters:
            branches:
              ignore:
                - staging
                - master
      - system_tests:
          context:
            - engines_sca-scanners
            - snyk-bot-slack
          filters:
            branches:
              ignore:
                - staging
                - master
